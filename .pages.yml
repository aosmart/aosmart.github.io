      - name: author
        label: Auteur
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: Sections
        label: Sections
        type: block
        list: true
        blockKey: type
        blocks:
          - name: sous-titre
            component: sous-titre
          - name: sous-titre-avec-lien
            component: sous-titre-avec-lien
          - name: paragraphe
