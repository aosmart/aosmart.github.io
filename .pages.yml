media:
  input: public
  output: /

components:
  titre:
    label: Titre
    type: object
    fields:
      - name: titre
        label: Titre
        type: string
        required: true
      - name: sous-texte
        label: Sous-texte
        type: string
        required: true

  sous-titre:
    label: Sous-titre
    type: object
    fields:
      - name: sous-titre
        label: Sous-titre
        type: string
        required: true

  sous-titre-avec-lien:
    label: Sous-titre avec lien
    type: object
    fields:
      - name: sous-titre
        label: Sous-titre
        type: 
        required: true
      - name: lien
        label: Lien
        type: string
        required: true

  paragraphe:
    label: Paragraphe
    type: object
    fields:
      - name: paragraphe
        label: Paragraphe
        type: rich-text
        required: true

  imageLegende:
    label: Image + Légende
    type: object
    fields:
      - name: image
        label: Image
        type: image
        required: true
      - name: legende
        label: Légende
        type: rich-text
        required: true
      - name: alt
        label: Texte alternatif
        type: string
        required: true

  doubleImageLegende:
    label: Double image + double légende
    type: object
    fields:
      - name: image1
        label: Image 1
        type: image
        required: true
      - name: alt1
        label: Texte alternatif image 1
        type: string
        required: true
      - name: legende1
        label: Légende image 1
        type: rich-text
        required: true

      - name: image2
        label: Image 2
        type: image
        required: true
      - name: alt2
        label: Texte alternatif image 2
        type: string
        required: true
      - name: legende2
        label: Légende image 2
        type: rich-text
        required: true

  gallerie_imageLegende:
    label: Image + Légende (gallerie)
    type: object
    fields:
      - name: image
        label: Image
        type: image
        required: true
      - name: legende
        label: Légende
        type: string
        required: true
      - name: alt
        label: Texte alternatif
        type: string
        required: true

  gallerie_doubleImageLegende:
    label: Double image + double légende (gallerie)
    type: object
    fields:
      - name: image1
        label: Image 1
        type: image
        required: true
      - name: alt1
        label: Texte alternatif image 1
        type: string
        required: true
      - name: legende1
        label: Légende image 1
        type: rich-text
        required: true

      - name: image2
        label: Image 2
        type: image
        required: true
      - name: alt2
        label: Texte alternatif image 2
        type: string
        required: true
      - name: legende2
        label: Légende image 2
        type: rich-text
        required: true

  graphiqueTempsReel:
    label: Graphique en temps réel
    type: object
    fields:
      - name: legende
        label: Légende
        type: rich-text
        required: true
      - name: fichier
        type: string
        required: true

  doubleGraphiqueTempsReel:
    label: Double graphique en temps réel
    type: object
    fields:

      - name: legende1
        label: Légende du graphique 1
        type: rich-text
        required: true

      - name: fichier1
        label: Fichier du graphique 1
        type: file
        required: true

      - name: legende2
        label: Légende du graphique 2
        type: rich-text
        required: true

      - name: fichier2
        label: Fichier du graphique 2
        type: file
        required: true

  membreEquipe:
    label: Membre d'équipe
    type: object
    fields:
      - name: nom
        label: Nom
        type: string
        required: true

      - name: sous-texte
        label: Sous-texte
        type: string
        required: true

      - name: description
        label: Description
        type: rich-text
        required: true

      - name: photo
        label: Photo
        type: image
        
  htmlBlock:
    label: htmlBlock
    type: object
    fields:
      - name: htmlBlock
        label: html
        type: code
        required: true
        options:
          format: html

content:
  - name: Accueil
    label: Accueil
    type: file
    path: src/pagesMarkdown/index.md

    fields:
      - name: Sections
        label: Sections
        type: block
        list: true
        blockKey: type
        blocks:
          - name: titre
            component: titre
          - name: sous-titre
            component: sous-titre
          - name: sous-titre-avec-lien
            component: sous-titre-avec-lien
